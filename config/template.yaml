# This config file hows an example of how to configure the genotyping workflow
# Edit as appropriate to the dataset to which the workflow will be applied
# Typically refs (=references) can be left unchanged

# Dependencies
deps:
  # Sample sheet. See README for column specifications
  donors: "config/genotyping/donors.csv"
  # Directory containing .CEL files
  cel: "data/snp/microarray"

# Outputs
outs:
  vcf_hg19: "data/snp/genotyping/donors.hg19.vcf.gz"
  vcf_hg38: "data/snp/genotyping/donors.hg38.vcf.gz"
  psam: "data/snp/genotyping/donors.psam"
  id_map: "data/snp/genotyping/id_map.tsv"
  logs: "logs/snp/genotyping"

# Container images
containers:
  # Image providing Analysis Power Tools (APT) and SNPolisher.
  #
  # APT is proprietary software that cannot be redistributed with this
  # workflow, so you have to supply this image yourself. Build one with the
  # Dockerfile in containers/apt/ (see containers/apt/README.md), then point
  # this at it -- either a reference to a registry you control, or the path
  # to a local Singularity image:
  #
  #   apt: "docker://your-private-registry/apt:2.12.0"
  #   apt: "containers/apt-2.12.0.sif"
  #
  # Set this first, then run prep.sh to populate it:
  #
  #   ./modules/genotyping/prep.sh --configfile config/genotyping/config.yaml
  #
  # A local path must be a Singularity image file, not a docker save tarball:
  # Snakemake runs every container through Singularity, even docker:// ones.
  #
  # There is no default: containers.apt must be set, or the workflow stops
  # immediately with an error. For the manuscript's calling step, build APT
  # 2.10.0:
  #
  #   ./modules/genotyping/prep.sh --configfile config/genotyping/config.yaml --apt-version 2.10.0
  apt:

# References
refs:
  genomes:
    hg19: "resources/genomes/hg19/hg19.fa.gz"
    # The hg38 (GRCh38) reference is built by the workflow (rule prepare_hg38)
    # from Ensembl release-98 per-chromosome FASTAs, fetched into the directory
    # below by dvc import-url (main chromosomes only). Its sequence is
    # byte-identical to the 10x GRCh38-2020-A reference previously used
    # ("resources/genomes/refdata-gex-GRCh38-2020-A/fasta/genome.fa", an 18 GB
    # import from a private lab repository); only the empty scaffold contigs
    # are omitted, which changes the VCF header but not the variant calls.
    hg38_chromosomes: "resources/genomes/GRCh38"
    chain: "resources/liftover/hg19ToHg38.over.chain.gz"
  apt:
    arg_file: "resources/genotyping/annotation/Axiom_UKB_WCSG.r5.apt-genotype-axiom.AxiomCN_GT1.apt2.xml"
    ps2snp: "resources/genotyping/annotation/Axiom_UKB_WCSG.r5.ps2snp_map.ps"
    annotation: "resources/genotyping/annotation/Axiom_UKB_WCSG.na35.annot.db"
