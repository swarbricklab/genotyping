# This config file is used for running the workflow on the test dataset

# Dependencies
deps:
  # Sample sheet. See README for column specifications.
  #
  # The CEL files it names are four hiPSC lines from GEO series GSE224950,
  # deposited by the Powell lab for Neavin et al. 2023. They are not shipped
  # here; fetch them with
  #
  #   ./prep.sh --what testdata
  #
  # See test/data/gse224950.sha256 for the samples and their provenance.
  donors: config/donors.csv

# Container images
containers:
  # Image providing APT and SNPolisher. The Best-Practices front-end needs APT
  # 2.12.0 (it provides apt-geno-qc-axiom for Dish QC, which the older 2.10.x
  # image lacks). Build it from containers/apt/ (see containers/apt/README.md),
  # then place it here with:
  #
  #   ./prep.sh --from apt-2.12.0.tar --configfile config/test.yaml
  #
  apt: "containers/apt-2.12.0.sif"

# References
refs:
  genomes:
    hg19: "resources/genomes/hg19/hg19.fa.gz"
    # The hg38 (GRCh38) reference is built by the workflow (rule prepare_hg38)
    # from Ensembl release-98 per-chromosome FASTAs, fetched into the directory
    # below by dvc import-url (main chromosomes only). Its sequence is
    # byte-identical to the 10x GRCh38-2020-A reference used for the published
    # runs; only the empty scaffold contigs are omitted. This replaces the
    # previous "resources/genomes/refdata-gex-GRCh38-2020-A/fasta/genome.fa",
    # which was an 18 GB import from a private lab repository.
    hg38_chromosomes: "resources/genomes/GRCh38"
    chain: "resources/liftover/hg19ToHg38.over.chain.gz"
  # Axiom array files, fetched from Thermo Fisher by
  #
  #   ./prep.sh --what resources --configfile config/test.yaml
  #
  # which reads arg_file below to decide where they go. This deliberately does
  # not reuse resources/genotyping: that is a DVC import from a private lab
  # repository, so pointing the test at it would make the test unrunnable for
  # anyone outside the lab.
  apt:
    # arg_file anchors the directory the other library files are resolved
    # against; prep.sh reads it to decide where to download them. Genotyping
    # itself uses the Step1/Step2 SNP-specific-priors arg files below.
    arg_file: "resources/axiom/Axiom_UKB_WCSG.r5.apt-genotype-axiom.AxiomCN_GT1.apt2.xml"
    ps2snp: "resources/axiom/Axiom_UKB_WCSG.r5.ps2snp_map.ps"
    annotation: "resources/axiom/Axiom_UKB_WCSG.na35.annot.db"
    special_snps: "resources/axiom/Axiom_UKB_WCSG.r5.specialSNPs"
    # Best-Practices QC/genotyping arg files (fetched by prep.sh --what resources):
    dqc_arg_file: "resources/axiom/Axiom_UKB_WCSG.r5.apt-geno-qc.AxiomQC1.xml"
    step1_arg_file: "resources/axiom/Axiom_UKB_WCSG_SNPSpecificPriors_Step1.r5.apt-genotype-axiom.AxiomGT1.apt2.xml"
    step2_arg_file: "resources/axiom/Axiom_UKB_WCSG_SNPSpecificPriors_Step2.r5.apt-genotype-axiom.AxiomGT1.apt2.xml"

# Quality control (Axiom Best Practices thresholds)
qc:
  dqc_threshold: 0.82            # drop samples with Dish QC below this
  call_rate_threshold: 97.0      # drop samples with QC call rate (%) below this
  plate_call_rate_threshold: 98.5  # a plate's mean call rate must be >= this
  plate_pass_rate_threshold: 95.0  # % of a plate's samples that must pass
  exclude_failing_plates: false  # advisory by default: flag but keep failing plates

# Outputs
outs:
  vcf_hg19: "test/results/test.hg19.vcf.gz"
  vcf_hg38: "test/results/test.hg38.vcf.gz"
  psam: "test/results/test.psam"
  id_map: "test/results/id_map.tsv"
  report: "test/report"
  logs: "logs/genotyping"