# Workflow profile

# Conda settings
use-conda: True
conda-frontend: mamba

# General settings
verbose: False
keep-going: True
rerun-incomplete: True
latency-wait: 30
retries: 0

# Resource settings per rule
set-resources:
  map_samples:
    threads: 1
    mem: "4GB"
    runtime: 5
  list_cel_files:
    threads: 5
    mem: "4GB"
    runtime: 1
  apt:
    threads: 10
    mem: "16GB"
    runtime: 120
  make_vcf:
    mem: "12GB"
    runtime: 120
  otv_caller:
    threads: 20
    mem: "4GB"
    runtime: 720
  ps_metrics:
    threads: 10
    mem: "8GB"
    runtime: 25
  ps_classification:
    threads: 10
    mem: "8GB"
    runtime: 30
  format_vcf:
    threads: 1
    mem: "8GB"
    runtime: 60
  sort_vcf:
    threads: 1
    mem: "8GB"
    runtime: 60
  index_vcf:
    threads: 1
    mem: "8GB"
    runtime: 100
  liftover:
    threads: 1
    mem: "8GB"
    runtime: 120