# Workflow profile

# Conda settings
use-conda: True
conda-frontend: mamba

# General settings
verbose: False
keep-going: True
rerun-incomplete: True
latency-wait: 30
retries: 0

# Resource settings per rule
# Only rules that run on the cluster are listed here. The rules named in the
# 'localrules' directive in workflow/Snakefile run in the Snakemake process and
# do not take a resource allocation.
set-resources:
  prepare_hg19:
    threads: 1
    mem: "4GB"
    runtime: 30
  apt:
    threads: 10
    mem: "32GB"
    runtime: 120
  make_vcf:
    mem: "12GB"
    runtime: 120
  otv_caller:
    threads: 20
    mem: "4GB"
    runtime: 720
  ps_metrics:
    threads: 10
    mem: "8GB"
    runtime: 25
  ps_classification:
    threads: 10
    mem: "8GB"
    runtime: 30
  format_vcf:
    threads: 1
    mem: "8GB"
    runtime: 60
  liftover:
    threads: 1
    mem: "8GB"
    runtime: 120
  remove_timestamps:
    threads: 1
    mem: "8GB"
    runtime: 60